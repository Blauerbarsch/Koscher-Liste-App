name: App bauen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build.yml"
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Koscherliste aus Branch "data" holen
        run: |
          mkdir -p app/src/main/assets
          if git fetch --depth 1 origin data; then
            for f in products.json barcodes.json brands.json; do git show FETCH_HEAD:$f > app/src/main/assets/$f; done
            echo "HAVE_DATA=1" >> $GITHUB_ENV
          else
            echo "Noch keine Daten – Testbau mit Beispieldaten, ohne Veröffentlichung"
            echo '{"fetched":"Test","products":[{"id":1,"name":"Choco Leibniz Milk","manufacturer":"Bahlsen","categories":["Kekse"],"certificates":["Triangel K"],"dairy":["Milchig"],"pessach":[],"notes":""}]}' > app/src/main/assets/products.json
            echo '{}' > app/src/main/assets/barcodes.json
            echo '{"Bahlsen":[["bahlsen"]]}' > app/src/main/assets/brands.json
          fi
          ls -la app/src/main/assets
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: APK bauen
        run: gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Veröffentlichen
        if: env.HAVE_DATA == '1'
        run: |
          cp app/build/outputs/apk/release/app-release.apk Koscher-Liste.apk
          STAND=$(python3 -c "import json;print(json.load(open('app/src/main/assets/products.json'))['fetched'])")
          ANZ=$(python3 -c "import json;print(len(json.load(open('app/src/main/assets/products.json'))['products']))")
          gh release create "v1.0.${GITHUB_RUN_NUMBER}" Koscher-Liste.apk --latest \
            --title "Koscher-Liste 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "Koscherliste vom ${STAND} mit ${ANZ} Produkten. Zum Installieren Koscher-Liste.apk auf dem Handy herunterladen und öffnen."
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Fehlerprotokoll ablegen
        if: failure()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          cp build.log /tmp/build.log 2>/dev/null || echo "kein Log" > /tmp/build.log
          git checkout --orphan debug-build
          git rm -rfq --cached . >/dev/null
          cp /tmp/build.log build.log
          git add build.log && git commit -qm "Build-Fehler" && git push -f origin debug-build:debug
